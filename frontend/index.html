<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stack Counter</title>
<meta name="description" content="Stack Counter -- bump the counter on Stacks mainnet (Clarity 4)" />
<!-- TALENT-PROTOCOL-META-PLACEHOLDER -->
<style>
  :root { color-scheme: dark; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0a0e1a; color: #e8eaed;
    max-width: 640px; margin: 0 auto; padding: 32px 20px;
    line-height: 1.5;
  }
  h1 { font-size: 28px; margin-bottom: 8px; color: #4ec5d9; }
  p.tagline { color: #8a93a6; margin-top: 0; }
  .card {
    background: #161b2c; border: 1px solid #25304a; border-radius: 8px;
    padding: 24px; margin: 24px 0;
  }
  .stat { font-size: 18px; margin: 4px 0; }
  .stat .v { color: #4ec5d9; font-weight: bold; }
  button {
    background: #5b2a98; color: white; border: 0; padding: 12px 24px;
    border-radius: 6px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #6f33b8; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  .addr, .log { font-size: 12px; color: #8a93a6; word-break: break-all; }
  .log { margin-top: 16px; }
  .log code { color: #e8eaed; background: #0a0e1a; padding: 2px 6px; border-radius: 3px; }
  a { color: #4ec5d9; }
</style>
</head>
<body>
  <h1>Stack Counter</h1>
  <p class="tagline">Bump the on-chain counter. Each call increments your count and the global total.</p>

  <div class="card">
    <div class="stat">Global total: <span class="v" id="total">loading...</span></div>
    <div class="addr" id="who">not connected</div>
  </div>

  <div class="row">
    <button id="connect">Connect Wallet</button>
    <button id="bump" disabled>Bump (+1)</button>
  </div>

  <div class="log" id="log"></div>

  <p class="addr" style="margin-top:32px;">
    Contract: <a id="contractLink" target="_blank" rel="noopener"></a><br />
    Network: Stacks Mainnet &middot; Clarity 4
  </p>

<script type="module">
  import { showConnect, openContractCall } from "https://esm.sh/@stacks/connect@7.7.1";
  import { cvToJSON, hexToCV, PostConditionMode } from "https://esm.sh/@stacks/transactions@6.17.0";

  const CONTRACT_ADDRESS = "SP16F6839630K5XX06KE7KVNSNMYBK89912NH6N4C";
  const CONTRACT_NAME    = "stack-counter";
  const APP_NAME         = "Stack Counter";
  const API              = "https://api.mainnet.hiro.so";

  const $ = (id) => document.getElementById(id);
  $("contractLink").href = `https://explorer.hiro.so/${CONTRACT_ADDRESS}.${CONTRACT_NAME}?chain=mainnet`;
  $("contractLink").textContent = `${CONTRACT_ADDRESS}.${CONTRACT_NAME}`;

  let userAddress = null;

  async function readTotal() {
    try {
      const res = await fetch(`${API}/v2/contracts/call-read/${CONTRACT_ADDRESS}/${CONTRACT_NAME}/get-total`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender: CONTRACT_ADDRESS, arguments: [] }),
      });
      const data = await res.json();
      if (data.okay) {
        const cv = hexToCV(data.result);
        $("total").textContent = cvToJSON(cv).value;
      } else {
        $("total").textContent = "(contract not yet confirmed)";
      }
    } catch (err) {
      $("total").textContent = "read error";
    }
  }

  $("connect").onclick = () => {
    showConnect({
      appDetails: { name: APP_NAME, icon: window.location.origin + "/icon.png" },
      onFinish: ({ userSession }) => {
        const userData = userSession.loadUserData();
        userAddress = userData.profile.stxAddress.mainnet;
        $("who").textContent = "you: " + userAddress;
        $("bump").disabled = false;
      },
    });
  };

  $("bump").onclick = () => {
    openContractCall({
      contractAddress: CONTRACT_ADDRESS,
      contractName:    CONTRACT_NAME,
      functionName:    "bump",
      functionArgs:    [],
      postConditionMode: PostConditionMode.Allow,
      network: "mainnet",
      appDetails: { name: APP_NAME, icon: window.location.origin + "/icon.png" },
      onFinish: (data) => {
        $("log").innerHTML = `tx submitted: <code>${data.txId}</code> &mdash; <a href="https://explorer.hiro.so/txid/${data.txId}?chain=mainnet" target="_blank">explorer</a>`;
        setTimeout(readTotal, 30000);
      },
    });
  };

  readTotal();
</script>
</body>
</html>
